<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Chat - CompTIA Knowledge Companion</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color:#f5f5f5;
            color:#333;
        }
        header{
            text-align:center;
            padding:1rem;
            background:#1E376C;
            color:white;
        }
        header h1{
            margin:0;
            font-size:1.4rem;
        }
        header p{
            margin:0;
            font-size:0.9rem;
        }
        .container{
            max-width:400px;
            margin:3rem auto;
            padding:2rem;
            background:white;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        h2{
            text-align:center;
            color:#1E376C;
            margin-bottom:1rem;
        }
        label{
            display:block;
            margin-top:0.75rem;
            font-weight:600;
        }
        input{
            width:100%;
            padding:0.75rem;
            margin-top:0.25rem;
            border:1px solid #ccc;
            border-radius:4px;
            text-align:left;
            box-sizing:border-box;
            display:block;
        }
        button{
            width:100%;
            padding:0.75rem;
            margin-top:1rem;
            background:#1E376C;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-size:1rem;
        }
        button:hover{
            background:#F47920;
        }
        .flash-messages{
            margin-bottom:1rem;
        }
        .flash{
            padding:0.5rem;
            background:#d4edda;
            color:#155724;
            border:1px solid #c3e6cb;
            border-radius:4px;
            margin-bottom:0.5rem;
        }
        .back-link{
            display:block;
            text-align:center;
            margin-top:1rem;
            color:#1E376C;
            text-decoration:none;
        }
        .back-link:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Snow College CompTIA Knowledge Companion</h1>
        <p>Edit Your Chat Session</p>
    </header>
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <p class="flash">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <h2>Edit Chat</h2>
        <form method="post">
            <label>Chat Name</label>
            <input type="text" name="chat_name" value="{{ chat.chat_name }}" required>
            <button type="submit">Update Chat</button>
        </form>
        <a href="/chat_history" class="back-link">Back to Chat History</a>
    </div>
</body>
</html>
