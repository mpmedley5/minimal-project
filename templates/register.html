<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CompTIA Knowledge Companion</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color:#f5f5f5;
            color:#333;
        }
        .container{
            max-width:400px;
            margin:3rem auto;
            padding:2rem;
            background:white;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        h2{
            text-align:center;
            color:#1E376C;
            margin-bottom:1rem;
        }
        label{display:block;margin-top:0.75rem;font-weight:600;}
        input{width:100%;padding:0.75rem;margin-top:0.25rem;border:1px solid #ccc;border-radius:4px;text-align:center;box-sizing:border-box;display:block;}
        button{width:100%;padding:0.75rem;margin-top:1rem;background:#1E376C;color:white;border:none;border-radius:4px;cursor:pointer;font-size:1rem;}
        button:hover{background:#F47920;}
        .error{color:red;font-size:0.9rem;margin-top:1rem;}
        .link{margin-top:1rem;text-align:center;font-size:0.9rem;}
    </style>
</head>
<body>
    <header style="text-align:center;padding:1rem;background:#1E376C;color:white;">
        <h1 style="margin:0;font-size:1.4rem;">Snow College CompTIA Knowledge Companion</h1>
        <p style="margin:0;font-size:0.9rem;">Create your account to begin studying</p>
    </header>
<div class="container">
    <h2>Register</h2>
    <form method="post">
        <label>First Name</label><input type="text" name="first_name" required>
        <label>Last Name</label><input type="text" name="last_name" required>
        <label>Email (@snow.edu)</label><input type="email" name="email" required>
        <label>Password</label><input type="password" name="password" required>
        <p style="font-size:0.85rem; color:#555; margin-top:0.5rem;">Use at least 10 characters with uppercase, lowercase, numbers, and symbols.</p>
        <button type="submit">Sign Up</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <p class="link">Already have an account? <a href="/login">Log in</a></p>
</div>
</body>
</html>
